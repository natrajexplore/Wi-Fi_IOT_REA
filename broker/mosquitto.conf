# mosquitto.conf — local lab broker for Hack My Own IoT
# ---------------------------------------------------------------------------
# A minimal Mosquitto config for running the lab on a machine you control.
# It requires a username/password (so the "credentials matter" lesson is real)
# and listens on plaintext 1883 for v1. TLS on 8883 for v2 is noted at the end.
#
# Run it FROM THE REPO ROOT (paths below are relative):
#   mosquitto -c broker/mosquitto.conf -v
#
# Create the password file first (one time):
#   mosquitto_passwd -c broker/passwd sensor01
#   # enter the same password you put in secrets.h / provision.ino
#
# Permissions gotcha (Mosquitto 2.x): run the broker as your normal user. If you
# start it as root it drops to the "mosquitto" user and then can't read a passwd
# file or keys owned by root ("Unable to open pwfile"). If you must use root:
#   sudo chown -R mosquitto: broker/passwd broker/certs
# ---------------------------------------------------------------------------

# --- v1: plaintext listener (the deliberately weak setup) ---
listener 1883 0.0.0.0

# Require auth. No anonymous clients — matches the firmware using a user/pass.
allow_anonymous false
password_file broker/passwd

# Keep the broker chatty so you can see the spoofed publishes land during the
# "break" phase.
log_type all
log_dest stdout

# ---------------------------------------------------------------------------
# --- v2: TLS listener (uncomment once you have certs) ---
#
# For the hardened phase the device connects over TLS on 8883 and pins the CA.
# Generate the lab CA + server cert with:  ./broker/make-certs.sh <ip> <dns-name>
# paste broker/certs/ca.crt into the device's MQTT_CA_PEM, and enable:
#
# listener 8883 0.0.0.0
# cafile   broker/certs/ca.crt
# certfile broker/certs/server.crt
# keyfile  broker/certs/server.key
# require_certificate false
#
# Then disable the 1883 listener so plaintext is genuinely closed — that is what
# makes the re-attack with attack-mqtt.py fail to connect, proving the fix.
# ---------------------------------------------------------------------------
